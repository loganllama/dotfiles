[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

# Dev box ID (exported by bash_additions.sh); hidden when unset.
[env_var.DEV_INSTANCE_ID]
format = "[⬢ $env_value]($style) "
style = "bold purple"

[username]
disabled = true

[hostname]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[git_branch]
disabled = true

[git_commit]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

[git_status]
disabled = true